# 一次性凭据导出：用外部提供的 RSA 公钥加密 Secret，只输出密文。
# 明文不会出现在仓库、日志或聊天里；用完立即删除本文件。
name: 凭据导出（临时）

on:
  workflow_dispatch:
    inputs:
      pubkey_b64:
        description: "base64(PEM 格式的 RSA 公钥)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: 加密并输出密文
        env:
          PUBKEY_B64: ${{ inputs.pubkey_b64 }}
          S_SENDER: ${{ secrets.NEWS_MAIL_SENDER }}
          S_PASSWORD: ${{ secrets.NEWS_MAIL_PASSWORD }}
          S_RECEIVER: ${{ secrets.NEWS_MAIL_RECEIVER }}
          S_EXTRA: ${{ secrets.NEWS_MAIL_RECEIVER_EXTRA }}
          S_HOST: ${{ secrets.NEWS_MAIL_HOST }}
        run: |
          set -euo pipefail
          printf '%s' "$PUBKEY_B64" | base64 -d > /tmp/pub.pem
          for k in SENDER PASSWORD RECEIVER EXTRA HOST; do
            eval "v=\$S_$k"
            enc=$(printf '%s' "$v" | openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem | base64 -w0)
            echo "EXPORT_$k=$enc"
          done
          rm -f /tmp/pub.pem

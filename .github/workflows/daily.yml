# 自动抓新闻，生成日报和网页看板
# GitHub 的定时任务会延迟几分钟到几小时，甚至整次漏跑，
# 所以同一件事排多次：邮件由 collector 自己判断"这个时段发过没"，
# 谁先跑起来谁发，发过就不再重复——晚一次也不会整份丢掉。

name: 每日新闻

on:
  schedule:
    # UTC 时间，北京时间 = UTC + 8
    - cron: '30 0,1 * * *'          # 北京 08:30 / 09:30  早报（第二发是补发）
    - cron: '30 2,4,6,8,10 * * *'   # 北京 10:30 12:30 14:30 16:30 18:30  抓取；早报漏了就补发
    - cron: '30 12,13,14 * * *'     # 北京 20:30 / 21:30 / 22:30  晚报（后两发是补发）
    - cron: '30 16 * * *'           # 北京 00:30  抓取
  workflow_dispatch:        # 支持在网页上手动点一下运行

# 允许提交数据、部署网页、调用 AI 模型
permissions:
  contents: write
  pages: write
  id-token: write
  models: read

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取新闻
        env:
          # 邮件配置（在仓库 Settings → Secrets 里填，不填就不发邮件）
          NEWS_MAIL_SENDER: ${{ secrets.NEWS_MAIL_SENDER }}
          NEWS_MAIL_PASSWORD: ${{ secrets.NEWS_MAIL_PASSWORD }}
          NEWS_MAIL_RECEIVER: ${{ secrets.NEWS_MAIL_RECEIVER }}
          NEWS_MAIL_HOST: ${{ secrets.NEWS_MAIL_HOST }}
          # AI 影响分析用 GitHub Models，内置 token 就能用
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 是否发邮件由 collector 按时间判断：08:30 后发早报、20:30 后发晚报，
          # 每个时段只发一次，其余时段只抓取。这样定时任务延迟也能补发。
          python collector.py --no-dedup

      - name: AI 连通性诊断（临时）
        run: |
          echo "--- A. catalog GET ---"
          curl -sS -D - -o /dev/null "https://models.github.ai/catalog/models" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" | head -20
          echo "--- B. POST 带响应头（不跟随重定向） ---"
          curl -sS -D - -X POST "https://models.github.ai/inference/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"hi"}],"max_tokens":20}' | head -30

      - name: 生成网页看板
        run: python build_site.py

      - name: 保存结果到仓库
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "没有新内容，跳过提交"
          else
            git commit -m "新闻日报 $(date +'%Y-%m-%d %H:%M')"
            # 并发的定时任务可能在我们运行期间也推了提交，先变基再推
            git pull --rebase origin main || git rebase --abort || true
            git push
          fi

      - name: 准备网页部署
        uses: actions/configure-pages@v5

      - name: 上传网页
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

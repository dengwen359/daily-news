  # ---------- 财经快讯（2026-11-06 补） ----------
  # 起因：11-05「民主党要暂停先进AI发展」这类政策转向新闻整条漏掉。
  # 查下来主因不是关键词，是根本没有源送这条——中文报道只在凤凰/腾讯/
  # 网易/财联社这些站，我们一个都没订。华尔街见闻的快讯接口实测可用，
  # 而且这类新闻密度很高（得州暂停数据中心、特朗普甩锅股市都在里面）。
  - name: 华尔街见闻·全球快讯
    group: wscn
    type: json_lives          # 接口返回 JSON，不是 RSS
    live: true                # 快讯源：只认 live_strong 里的强政策词才升要闻
    url: https://api-one.wallstcn.com/apiv1/content/lives?channel=global-channel&client=pc&limit=100
    enabled: true

  - name: 华尔街见闻·文章
    url: https://dedicated.wallstreetcn.com/rss.xml
    live: true                # 标题常带"创业板""中间价"，同样只认强政策词
    enabled: true

  # ---------- 备用源（公共 RSSHub，忙时限流，默认关闭） ----------
  - name: 财联社电报
    url:
      - https://rsshub.ktachibana.party/cls/telegraph
      - https://rss.owo.nz/cls/telegraph
    enabled: false

  - name: 澎湃新闻
    url:
      - https://rsshub.ktachibana.party/thepaper/featured
      - https://rss.owo.nz/thepaper/featured
    enabled: true

# ---------- 时间窗口 ----------
# 只收最近 N 小时内发布的（小时）
hours_window: 30

# 有些源的 RSS 不带发布时间（如部分党媒），无法判断新旧，
# 每个这种源最多取前 N 条，避免倒出整个历史库
max_undated: 15

# ---------- 正文补抓 ----------
# RSS 摘要常常只有一句导语（"中新网北京10月26日电（记者 xxx）…"），
# 打开不够的会去原文页面把正文前几段抓下来，这样每条新闻下面都有实质内容。
enrich:
  enabled: true
  min_chars: 150      # 摘要短于这个字数才去抓原文
  target_chars: 300   # 抓到后保留多少字（超过按句号截断）
  max_items: 80       # 单次最多抓多少条，控制运行时间
  timeout: 10
  workers: 6          # 并发数，太高容易被网站限流

# ---------- 条数控制 ----------
# 一份日报塞太多条会看不完，所以按源限量：超出部分折叠到"其余"里，不丢内容。
limits:
  max_per_feed: 8     # 中文权威源每个源最多先列几条
  max_per_topic: 12   # 每个栏目最多先列几条
  max_per_feed_en: 5  # 英文源每个源最多先列几条
  # 2026-11-06 改口径后每天只剩十几条大事，配额不再是"必须凑满"，
  # 而是"最多给几条"：有几条发几条，绝不为凑数塞噪音。
  mail_must: 12      # 邮件里突发最多给几条
  mail_level1: 15    # 邮件里重大新闻最多给几条
  mail_interest: 0   # 兴趣区已取消（只收大事，没有兴趣级）
  mail_per_feed: 4    # 邮件里同一个源最多占几条（避免一整封都是同一家通稿）
  mail_en: 2          # 邮件里外媒原文最多列几条标题
  mail_body_chars: 80   # 邮件里每条正文摘录最多多少字（中文 3 字节/字，太长会被 139 判垃圾）
  # 整封信（纯文本+HTML）的体积上限，超过会自动减条目、缩摘要后重排
  mail_max_kb: 20

# ============================================================
# AI 影响分析（Pollinations 免费接口，零成本、免注册）
# ============================================================
# 注意：云端 GitHub Actions 的出口是数据中心 IP，会被接口拒收（402），
# 所以云端不做新分析（max_items=0），分析由本机桌面巡检程序顺带完成：
# 它每 30 分钟跑一次，用家里的宽带分析几条并推回 data/ai.json，
# 云端装配进邮件和看板。结果按条目缓存，同一条不重复分析。
ai:
  enabled: true
  model: openai
  max_items: 0        # 云端不新分析（由本机完成），只装配缓存里的结果

# ---------- 输出 ----------
output_dir: reports
keep_days: 90

# ---------- 网页看板 ----------
# 邮件末尾会给出这个链接，点开能看到完整日报和原文链接
site_url: https://dengwen359.github.io/daily-news/

# ---------- 邮件 ----------
# 填好信息并把 enabled 改成 true 就会自动发邮件
# receiver 可以填多个地址，用英文逗号分隔：
#   receiver: "手机@qq.com,电脑@outlook.com"
# 在 GitHub 上运行时，这些值会被仓库 Secrets 覆盖，密码不会出现在代码里
email:
  enabled: true
  smtp_host: smtp.139.com          # 中国移动 139 邮箱
  smtp_port: 465
  # 下面三项在仓库 Secrets 里已配置，运行时会被覆盖。
  # 这里留占位，避免邮箱地址出现在公开仓库里。
  sender: ""
  password: ""
  receiver: ""

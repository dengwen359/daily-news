# ============================================================
# 三大栏（2026-11-06 重构）
# ============================================================
# 原来的「科技与产业 / 财经投资 / 时政国际」全部取消。
# 现在只按"这事发生在谁的桌上"分三栏：
#
#   美国重大 —— 总统与白宫的公开表态、美联储、财政部、国会立法、SEC、
#               关税与出口管制、美股剧震、AI 与芯片监管。
#               注意：AI 监管放这里，不放科技栏。一条「暂停先进 AI 发展」
#               或者「对华芯片出口管制」能直接带崩整个板块，它是政策事件，
#               不是产品新闻。这类必须进首栏，不能掉进后面的次要位置。
#   国内政策 —— 中央与国务院、央行、证监会、财政部、发改委、统计局、
#               重大产业政策与宏观数据。
#   突发事件 —— 战争、天灾、重大事故（不分国别，中国的地震也在这），
#               以及其他主要经济体（欧央行、日央行、OPEC）的重大决议。
#
# weight 决定同级别里的排序优先级：栏目越靠前，同分时越优先。
topics:
  美国重大:
    weight: 3
    keywords:
      # ---- 人物与机构 ----
      - 特朗普
      - Trump
      - 白宫
      - 美国总统
      - 美国副总统
      - 万斯
      - 美联储
      - 鲍威尔
      - Powell
      - FOMC
      - Federal Reserve
      - 联邦基金利率
      - 美国财政部
      - 美国商务部
      - 美国贸易代表
      - 美国国会
      - 参议院
      - 众议院
      - 美国议员
      - 民主党
      - 共和党
      - 最高法院
      - 五角大楼
      - 国务卿
      - 美国国务院
      - 美国证监会
      - SEC
      - 美国政府
      # ---- 贸易与产业政策 ----
      - 关税
      - 贸易战
      - 贸易协定
      # 注意：出口管制、实体清单这类"动作词"不放在这里。
      # 它们是强度词（见 intensity），拿来定栏会把"中荷出口管制对话"
      # 这种双边会谈误算成美国重大。美国发起的管制必然带白宫/商务部/特朗普。
      - 行政令
      - 政府停摆
      # ---- 科技监管（政策口径，不是产品新闻） ----
      - AI监管
      - 人工智能法案
      - 芯片法案
      - 芯片出口
      - 暂停数据中心
      - 超级智能
      - moratorium
      - superintelligence
      # ---- 美国市场 ----
      - 美股
      - 纳斯达克
      - 标普500
      - 道琼斯
      - 华尔街

  国内政策:
    weight: 3

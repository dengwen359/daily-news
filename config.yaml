    - 联邦基金利率
    - 点阵图
    - 流动性
    - 公开市场
    # ---- 财政、贸易与监管动作 ----
    - 加征关税
    - 上调关税
    - 取消关税
    - 关税
    - 出口管制
    - 实体清单
    - 制裁
    - 禁令
    - 立法
    - 法案
    - 提案
    - 签署
    - 通过法案
    - 法案通过
    - 暂停先进
    - 暂停数据中心
    - 暂停研发
    - 暂停AI
    - 暂停人工智能
    - 数据中心停建

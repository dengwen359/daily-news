# ===== 新闻收集器配置 =====
# 想改关注方向，只改这个文件就行，不用碰代码。

# ============================================================
# 突发必看（保证不遗漏）
# ============================================================
# 命中下面这些词（标题）的内容直接进「必看」区置顶：
# 战争冲突、自然灾害、重大事故灾难，国内国际都算。
breaking:
  keywords:
    # ---- 总类 ----
    - 突发
    # ---- 天灾 ----
    - 地震
    - 海啸
    - 台风
    - 飓风
    - 洪水
    - 暴雨
    - 山火
    - 泥石流
    - 塌方
    - 火山
    - 旱灾
    # ---- 事故灾难 ----
    - 爆炸
    - 空难
    - 坠机
    - 沉没
    - 遇难
    - 伤亡
    - 失联
    # ---- 战争与冲突 ----
    # 注意：不放单独的"战争"——评论标题里到处是"伊朗战争不结束"，
    # 一句顺带提及就会把加息新闻误标成突发必看。只认具体动作。
    - 开战
    - 交火
    - 停火
    - 宣战
    - 空袭
    - 袭击
    - 恐袭
    - 枪击
    - 导弹
    - 政变
    - 戒严
    - 紧急状态
    - 核试验

# ============================================================
# 国家级大事（排序加权，不改变分级）
# ============================================================
# 标题命中下面这些词的条目会在同级别里大幅加权，
# 确保五中全会、国务院常务会议这类大事稳进邮件要闻区，
# 不会被同源的其他通稿挤掉。
heavy_events:
  keywords:
    - 全会
    - 中央委员会
    - 人大常委会
    - 政治局
    - 国务院
    - 国常会
    - 中央经济工作会议
    - 政府工作报告
    - 一号文件
    - 中央财经委员会
    - 中央军委
    - 公报

# ============================================================
# 事件强度词（2026-11-06 重构：只收三类大事）
# ============================================================
# 新口径只收三种新闻：美国重大、国内政策、突发事件。
# 一条新闻要进来，必须同时满足两条：
#   ① 命中 topics 里某一栏的关键词（判断这事属于哪一栏）
#   ② 命中下面这批"事件强度词"（判断这事真的发生了，不是随便聊聊）
#
# 只满足①、不满足②的一律丢弃。例如：
#   「英伟达发布新一代芯片」 → ①未命中 → 丢
#   「AI 大模型评测榜单」    → ①未命中 → 丢
#   「美股暴跌 800 点」      → ①美股 + ②暴跌 → 收，进美国重大
#   「民主党提案暂停先进AI」 → ①民主党 + ②暂停先进 → 收，进美国重大
#
# 例外：美联储、SEC、统计局这类机构源发的本身就是事件，源即准入（institution: true）。

    - 反垄断
    - 监管新规
    - 立案调查
    - 退市
    - 印花税
    - 特别国债
    - 专项债
    - 赤字率
    - 注册制
    # ---- 国家级会议与文件 ----
    - 政治局
    - 政治局会议
    - 全会
    - 中央委员会
    - 人大常委会
    - 国务院
    - 国常会
    - 国务院常务会议
    - 中央经济工作会议
    - 政府工作报告
    - 一号文件
    - 中央财经委员会
    - 印发
    - 部署
    # ---- 宏观数据 ----
    - CPI
    - PPI
    - GDP
    - 社融
    - 社会融资
    - PMI
    - 非农
    - 失业率
    - 外汇储备
    # ---- 冲突与战争 ----
    - 开战
    - 宣战
    - 空袭
    - 入侵
    - 军事行动
    - 导弹袭击
    - 交火
    - 停火
    - 政变
    - 恐袭
    - 恐怖袭击
    - 暗杀
